<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevWiki</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@material/web@1.5.0/all.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@material/web@1.5.0/all.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    :root {
      font-family: 'Roboto', sans-serif;
      --md-sys-color-background: #ffffff;
      --md-sys-color-on-background: #1b1b1f;
      --md-sys-color-surface: #f8f9fa;
      --md-sys-color-surface-container: #ededed;
      --md-sys-color-outline: #74777f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--md-sys-color-background); color: var(--md-sys-color-on-background); display: flex; height: 100vh; overflow: hidden; }

    nav {
      width: 280px;
      border-right: 1px solid var(--md-sys-color-outline);
      background: var(--md-sys-color-surface);
      display: flex;
      flex-direction: column;
      padding: 16px 12px;
      gap: 8px;
      flex-shrink: 0;
      transition: transform 0.3s ease;
      z-index: 200;
      overflow-y: auto;
    }

    .brand { display: flex; align-items: center; gap: 12px; padding: 12px; font-size: 20px; font-weight: 700; }
    
    md-list {
      display: block !important;
      width: 100% !important;
      background: transparent;
    }

    md-list-item { 
      display: block !important;
      width: 100% !important;
      border-radius: 28px; 
      cursor: pointer; 
      margin-bottom: 2px;
    }
    
    md-list-item[active] { background: var(--md-sys-color-surface-container); }

    .main-wrapper { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; width: 100%; }

    header {
      height: 64px;
      border-bottom: 1px solid var(--md-sys-color-outline);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
    }

    .menu-btn { display: none; background: none; border: none; cursor: pointer; padding: 8px; }
    .search-bar {
      display: flex;
      align-items: center;
      background: var(--md-sys-color-surface-container);
      border-radius: 28px;
      padding: 0 16px;
      flex-grow: 1;
      max-width: 360px;
      height: 44px;
      gap: 8px;
    }

    .search-bar input { border: none; background: transparent; outline: none; width: 100%; font-size: 14px; }
    .backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 150; }

    main { flex-grow: 1; overflow-y: auto; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }

    h1 { font-size: 26px; margin-bottom: 4px; font-weight: 500; }
    .subtitle { color: #54595d; font-size: 13px; margin-bottom: 20px; }

    .infobox {
      width: 100%;
      max-width: 300px;
      border: 1px solid var(--md-sys-color-outline);
      border-radius: 8px;
      padding: 12px;
      margin: 0 0 16px 0;
      background: var(--md-sys-color-surface);
    }

    @media (min-width: 768px) {
      .infobox { float: right; margin: 0 0 16px 16px; }
    }

    .infobox-title { font-weight: 700; text-align: center; padding-bottom: 8px; border-bottom: 1px solid var(--md-sys-color-outline); margin-bottom: 8px; }
    .infobox-row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; }
    .infobox-key { color: #54595d; }

    .content-text { font-size: 15px; line-height: 1.6; margin-bottom: 16px; }

    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 16px; }
    .card {
      border: 1px solid var(--md-sys-color-outline);
      border-radius: 12px;
      padding: 14px;
      background: var(--md-sys-color-surface);
      cursor: pointer;
    }
    .card:hover { background: var(--md-sys-color-surface-container); }
    .card-title { font-weight: 700; font-size: 15px; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .card-desc { font-size: 13px; color: #44474e; }

    @media (max-width: 768px) {
      nav { position: fixed; top: 0; bottom: 0; left: 0; transform: translateX(-100%); }
      nav.open { transform: translateX(0); }
      .backdrop.open { display: block; }
      .menu-btn { display: flex; align-items: center; }
      .search-bar { max-width: 100%; }
      main { padding: 16px; }
    }
  </style>
</head>
<body>

  <div class="backdrop" id="backdrop" onclick="toggleMenu()"></div>

  <nav id="sidebar">
    <div class="brand">
      <span class="material-symbols-outlined">menu_book</span>
      DevWiki
    </div>
    <md-divider></md-divider>
    <md-list id="navList"></md-list>
  </nav>

  <div class="main-wrapper">
    <header>
      <button class="menu-btn" onclick="toggleMenu()">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <div class="search-bar">
        <span class="material-symbols-outlined">search</span>
        <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Поиск по вики...">
      </div>
    </header>

    <main>
      <div class="container" id="appContent"></div>
    </main>
  </div>

  <script>
    let manifestData = [];

    function toggleMenu() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('backdrop').classList.toggle('open');
    }

    async function initWiki() {
      try {
        const res = await fetch('./pages/manifest.json');
        manifestData = await res.json();
        
        const navList = document.getElementById('navList');
        navList.innerHTML = manifestData.map(item => `
          <md-list-item id="nav-${item.id}" onclick="loadPage('${item.id}')">
            <span class="material-symbols-outlined" slot="start">${item.icon || 'article'}</span>
            <div slot="headline">${item.title}</div>
          </md-list-item>
        `).join('');

        loadPage('home');
      } catch (e) {
        document.getElementById('appContent').innerHTML = '<h2>Ошибка загрузки манифеста pages/manifest.json</h2>';
      }
    }

    async function loadPage(pageId) {
      try {
        const res = await fetch(`./pages/${pageId}.json`);
        const page = await res.json();

        document.querySelectorAll('md-list-item').forEach(el => el.removeAttribute('active'));
        const activeNav = document.getElementById(`nav-${pageId}`);
        if (activeNav) activeNav.setAttribute('active', '');

        let html = `<h1>${page.title}</h1>`;
        if (page.subtitle) html += `<div class="subtitle">${page.subtitle}</div>`;

        if (page.infobox) {
          html += `<div class="infobox">
            <div class="infobox-title">${page.infobox.title}</div>
            ${page.infobox.rows.map(r => `
              <div class="infobox-row">
                <span class="infobox-key">${r.key}:</span>
                <span>${r.value}</span>
              </div>
            `).join('')}
          </div>`;
        }

        if (page.content) {
          page.content.forEach(p => {
            html += `<div class="content-text">${p}</div>`;
          });
        }

        if (page.cards) {
          html += `<div style="clear: both;"></div><div class="card-grid">`;
          page.cards.forEach(c => {
            const clickAttr = c.targetId ? `onclick="loadPage('${c.targetId}')"` : '';
            html += `
              <div class="card" ${clickAttr}>
                <div class="card-title">
                  ${c.icon ? `<span class="material-symbols-outlined">${c.icon}</span>` : ''}
                  ${c.title}
                </div>
                <div class="card-desc">${c.desc}</div>
              </div>
            `;
          });
          html += `</div>`;
        }

        document.getElementById('appContent').innerHTML = html;

        if (window.innerWidth <= 768) {
          document.getElementById('sidebar').classList.remove('open');
          document.getElementById('backdrop').classList.remove('open');
        }
      } catch (e) {
        document.getElementById('appContent').innerHTML = `<h2>Страница ${pageId}.json не найдена</h2>`;
      }
    }

    function handleSearch() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!q) return;

      const results = manifestData.filter(i => 
        i.title.toLowerCase().includes(q) || (i.keywords && i.keywords.toLowerCase().includes(q))
      );

      let html = `<h1>Результаты поиска</h1><div class="subtitle">Найдено: ${results.length}</div><div class="card-grid">`;
      results.forEach(r => {
        html += `
          <div class="card" onclick="loadPage('${r.id}')">
            <div class="card-title">
              <span class="material-symbols-outlined">${r.icon || 'article'}</span>
              ${r.title}
            </div>
            <div class="card-desc">Открыть страницу</div>
          </div>
        `;
      });
      html += `</div>`;
      document.getElementById('appContent').innerHTML = html;
    }

    initWiki();
  </script>
</body>
</html>
